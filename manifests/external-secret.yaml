# Secrets come from Infisical (https://infisical.everesto.live), synced by ESO into the
# Kubernetes secret "backstage-secrets". Nothing secret is stored in this (public) repo.
#
# Infisical: project "backstage", environment "prod", root folder "/", with keys
#   POSTGRES_HOST · POSTGRES_PASSWORD · AUTH_GITHUB_CLIENT_ID · AUTH_GITHUB_CLIENT_SECRET
#   POSTGRES_CA (PEM of the DB server cert — mounted as a file, see values.yaml)
# The only secret created by hand: "infisical-universal-auth" (Infisical machine identity, see README).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://infisical.everesto.live
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            key: clientSecret
      secretsScope:
        projectSlug: CHANGE-ME     # Infisical → project backstage → Settings → "Project slug"
        environmentSlug: prod
        secretsPath: /
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-secrets
spec:
  refreshInterval: 1h            # rotated in Infisical → picked up within an hour
  secretStoreRef:
    kind: SecretStore
    name: infisical
  target:
    name: backstage-secrets      # what values.yaml → extraEnvVarsSecrets reads
  dataFrom:
    - find:
        name:
          regexp: ".*"           # every key in the project's prod root
