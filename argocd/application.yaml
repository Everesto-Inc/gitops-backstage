# Apply ONCE, AFTER argocd/appproject.yaml (then ArgoCD manages everything from git):
#   kubectl apply -n argocd -f argocd/application.yaml
# Or in the ArgoCD UI: project backstage · repo this repo · revision main · path apps/prod ·
# cluster in-cluster · namespace prod-backstage (ArgoCD detects the Helm chart by itself).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-prod
  namespace: argocd
spec:
  project: backstage            # argocd/appproject.yaml — only namespace prod-backstage, only these repos
  source:
    repoURL: https://github.com/Everesto-Inc/gitops-backstage.git
    targetRevision: main
    path: apps/prod             # wrapper chart: official Backstage chart + values + ExternalSecret
    helm:
      releaseName: backstage    # keeps resource names "backstage" (Deployment, Service)
  destination:
    server: https://kubernetes.default.svc
    namespace: prod-backstage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
