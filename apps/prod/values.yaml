# Values for environment prod. Everything sits under `backstage:` because the official chart
# is a dependency of apps/prod/Chart.yaml (Helm passes that key to the sub-chart).
# CI (backstage-app) bumps `tag:` below on every build.
backstage:
  backstage:
    image:
      registry: ghcr.io
      repository: everesto-inc/backstage
      tag: "sha-1a7142b"
      pullPolicy: IfNotPresent
      pullSecrets: [ghcr-secret] # ghcr.io package is private → secret created by hand (README)

    args: ["--config", "app-config.yaml", "--config", "app-config.production.yaml"]

    # Database = the existing PostgreSQL on the GCP VM (database + user "backstage").
    # Not secret → here. Host + password → secret below.
    extraEnvVars:
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_USER
        value: backstage
    # From Infisical via ESO (templates/external-secret.yaml):
    # POSTGRES_HOST · POSTGRES_PASSWORD · AUTH_GITHUB_CLIENT_ID · AUTH_GITHUB_CLIENT_SECRET · POSTGRES_CA · GITHUB_APP_*
    extraEnvVarsSecrets: [backstage-secrets]

    # Mount the Postgres CA cert (POSTGRES_CA key in backstage-secrets) as a file so
    # app-config.production.yaml can verify the DB server cert (ssl.rejectUnauthorized: true).
    # DEPLOY ORDER: POSTGRES_CA must exist in Infisical BEFORE this syncs, or the pod
    # fails to mount the key. See templates/external-secret.yaml.
    extraVolumes:
      - name: postgres-ca
        secret:
          secretName: backstage-secrets
          items:
            - key: POSTGRES_CA
              path: ca.crt
    extraVolumeMounts:
      - name: postgres-ca
        mountPath: /etc/backstage/postgres
        readOnly: true

    # Recreate (not RollingUpdate): stop the old pod BEFORE starting the new one.
    # Two pods at once double the DB connections (~13 plugin pools × 3) and the shared
    # Postgres on the GCP VM (also used by Infisical) runs out of slots → new pod fails.
    # Cost: ~2 min downtime per deploy.
    strategy:
      type: Recreate

    # Small reservation, room to burst: requests decide placement, no CPU limit = may use all free CPU
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 1536Mi }

    # Prefer the argocd node (platform tools); fall back to control-plane if it is full or down
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [dev-k3s-argocd]

    # Backstage needs 1–2 min to start on 1 CPU — give it 5 min before the first health check fails
    startupProbe:
      httpGet:
        path: /.backstage/health/v1/liveness
        port: 7007
      periodSeconds: 10
      failureThreshold: 30

  # Reached by Traefik on alb: files/traefik/conf.d/backstage.yml → any node :30700
  service:
    type: NodePort
    nodePorts:
      backend: 30700

  postgresql:
    enabled: false
