# Environment "prod" = a thin wrapper chart around the official Backstage chart.
# ArgoCD points at this folder (path apps/prod) and runs `helm dependency build` itself.
# A future "dev" environment = copy this folder to apps/dev and change values.yaml.
apiVersion: v2
name: backstage-prod
description: Backstage developer portal — prod (https://backstage.everesto.live)
type: application
version: 0.1.0
dependencies:
  - name: backstage
    version: 2.10.2                              # official chart, pinned
    repository: https://backstage.github.io/charts
