# Secrets come from Infisical (https://infisical.everesto.live), synced by ESO into the
# Kubernetes secret "backstage-secrets" (namespace prod-backstage). Nothing secret is stored in this (public) repo.
#
# Infisical: project "backstage", environment "prod", root folder "/". Only these keys are copied:
#   POSTGRES_HOST · POSTGRES_PASSWORD · AUTH_GITHUB_CLIENT_ID · AUTH_GITHUB_CLIENT_SECRET
#   POSTGRES_CA (PEM of the DB server cert — mounted as a file, see values.yaml)
#   GITHUB_TOKEN (fine-grained PAT, Contents: read on Everesto-Inc/everesto-catalog — catalog source)
# Read through ClusterSecretStore "infisical-backstage" (platform/cluster-secret-store.yaml),
# whose Infisical login lives in namespace external-secrets — not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # sync before the Deployment that reads the secret
spec:
  refreshInterval: 1h            # rotated in Infisical → picked up within an hour
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-backstage
  target:
    name: backstage-secrets      # what values.yaml → extraEnvVarsSecrets reads
  # Explicit allow-list: only these keys reach the pod, even if more are added to the project.
  data:
    - secretKey: POSTGRES_HOST
      remoteRef: { key: POSTGRES_HOST }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: POSTGRES_PASSWORD }
    - secretKey: POSTGRES_CA
      remoteRef: { key: POSTGRES_CA }
    - secretKey: AUTH_GITHUB_CLIENT_ID
      remoteRef: { key: AUTH_GITHUB_CLIENT_ID }
    - secretKey: AUTH_GITHUB_CLIENT_SECRET
      remoteRef: { key: AUTH_GITHUB_CLIENT_SECRET }
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: GITHUB_TOKEN }
