# ArgoCD roles per DevOps Space — GENERATED by Backstage access sync. Do not edit by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels: { app.kubernetes.io/name: argocd-rbac-cm, app.kubernetes.io/part-of: argocd }
data:
  policy.default: ""          # signed in but in no team → sees nothing
  scopes: "[groups]"
  policy.csv: |
    # GENERATED by Backstage (everestoAccess.ts → access sync) — do not edit by hand.
    g, Everesto-Inc:platform-team, role:admin

    # DevOps Space orchid
    p, role:orchid-developer, applications, get, orchid/*, allow
    p, role:orchid-developer, applications, sync, orchid/*, allow
    p, role:orchid-developer, logs, get, orchid/*, allow
    p, role:orchid-developer, projects, get, orchid, allow
    p, role:orchid-maintainer, applications, delete, orchid/*, allow
    p, role:orchid-manager, applications, create, orchid/*, allow
    p, role:orchid-manager, applications, update, orchid/*, allow
    p, role:orchid-manager, applications, delete, orchid/*, allow
    g, role:orchid-maintainer, role:orchid-developer
    g, role:orchid-manager, role:orchid-developer
    g, Everesto-Inc:orchid-developers, role:orchid-developer
    g, Everesto-Inc:orchid-maintainers, role:orchid-maintainer
    g, Everesto-Inc:orchid-managers, role:orchid-manager

