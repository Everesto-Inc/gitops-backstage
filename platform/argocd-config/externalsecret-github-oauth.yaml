# GitHub OAuth app "ArgoCD · everesto" (Everesto-Inc) for the ArgoCD login (Dex).
# Infisical backstage/prod → Secret argocd-github-oauth in ns argocd. The label lets argocd-cm reference it as
# $argocd-github-oauth:clientId / :clientSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-oauth
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }   # secret before argocd-cm references it
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: infisical-backstage }
  target:
    name: argocd-github-oauth
    template:
      metadata:
        labels: { app.kubernetes.io/part-of: argocd }
  data:
    - secretKey: clientId
      remoteRef: { key: ARGOCD_GITHUB_CLIENT_ID }
    - secretKey: clientSecret
      remoteRef: { key: ARGOCD_GITHUB_CLIENT_SECRET }
