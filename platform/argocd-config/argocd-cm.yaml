# ArgoCD settings: login with GitHub (Dex), only members of Everesto-Inc. GitHub teams become groups
# "Everesto-Inc:<team>" → roles in argocd-rbac-cm.yaml (generated by Backstage). Local "admin" = break-glass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels: { app.kubernetes.io/name: argocd-cm, app.kubernetes.io/part-of: argocd }
data:
  url: https://argocd.everesto.live
  admin.enabled: "true"            # break-glass only — everyone else signs in with GitHub
  users.anonymous.enabled: "false"
  exec.enabled: "false"            # no shell into pods from the UI
  dex.config: |
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $argocd-github-oauth:clientId
          clientSecret: $argocd-github-oauth:clientSecret
          orgs:
            - name: Everesto-Inc   # only org members can sign in; their teams become groups
          teamNameField: slug
          useLoginAsID: true
