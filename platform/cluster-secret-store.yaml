# Platform-managed (NOT synced by the backstage ArgoCD app — its project forbids cluster-wide objects).
# Apply ONCE by hand:  kubectl apply -f platform/cluster-secret-store.yaml
#
# Pattern (scales to many apps/spaces): one ClusterSecretStore per Infisical project.
#  - The Infisical login lives in namespace "external-secrets" (platform admins only),
#    never in the app's namespace → app users can't read it.
#  - conditions: ONLY namespace prod-backstage may use this store → other namespaces
#    can't read Backstage's secrets.
#
# Prerequisite (typed by hand, never in git):
#   kubectl -n external-secrets create secret generic infisical-backstage-auth \
#     --from-literal=clientId='<CLIENT_ID>' --from-literal=clientSecret='<CLIENT_SECRET>'
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: infisical-backstage
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prod-backstage   # label k8s sets on every namespace
  provider:
    infisical:
      hostAPI: https://infisical.everesto.live
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-backstage-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-backstage-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: backstage-qgc-y   # Infisical → project backstage → Settings → "Project slug"
        environmentSlug: prod
        secretsPath: /
