# Platform-managed (cluster-wide RBAC — NOT synced by the backstage ArgoCD app, its project forbids it).
# Apply ONCE by hand:  sudo kubectl apply -f platform/backstage-k8s-readonly.yaml
#
# Backstage (ServiceAccount prod-backstage/backstage, created by the chart) may READ workloads in every
# namespace for the Kubernetes tab, and READ ArgoCD Applications for the Sync/Health status on CD cards.
# No Secrets, no ConfigMaps, no writes, no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-read
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, services, events, namespaces, limitranges, resourcequotas, replicationcontrollers]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-read
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: prod-backstage
