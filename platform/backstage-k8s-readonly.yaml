# Platform-managed (NOT synced by the backstage ArgoCD app — its project forbids cluster-wide objects).
# Apply ONCE by hand:  sudo kubectl apply -f platform/backstage-k8s-readonly.yaml
#
# Least privilege for Backstage (ServiceAccount prod-backstage/backstage):
#  - ClusterRole backstage-read = the READ rules only. It is NOT bound cluster-wide.
#    Each tenant deployment binds it inside its own namespace (apps/<env>/rolebinding-backstage.yaml,
#    synced by ArgoCD) → Backstage reads pods/logs/events ONLY in tenant namespaces (orchid-dev, …),
#    never in kube-system, argocd, external-secrets, awx, monitoring, prod-backstage.
#  - Role backstage-argocd-read in ns argocd: read ArgoCD Applications (Sync/Health on CD cards).
#  - No Secrets, no ConfigMaps, no writes, no exec.
# Revoke everything:  sudo kubectl delete -f platform/backstage-k8s-readonly.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-read
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-argocd-read
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-argocd-read
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-argocd-read
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: prod-backstage
