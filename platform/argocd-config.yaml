# Platform-managed: ArgoCD's own settings, kept in git (self-managed). Apply ONCE by hand:
#   sudo kubectl apply -n argocd -f platform/argocd-config.yaml
# Syncs platform/argocd-config/:
#   argocd-cm.yaml                     login with GitHub (Dex), only Everesto-Inc members
#   argocd-rbac-cm.yaml                roles per DevOps Space — GENERATED by Backstage (access sync)
#   externalsecret-github-oauth.yaml   OAuth app secret from Infisical (ESO)
# Break-glass: the local "admin" account stays enabled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-argocd-config
  namespace: argocd
spec:
  project: platform                     # fenced: platform/appproject-platform.yaml
  source:
    repoURL: https://github.com/Everesto-Inc/gitops-backstage.git
    targetRevision: main
    path: platform/argocd-config
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # never prune ArgoCD's own objects
